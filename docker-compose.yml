version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: text2sql_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: business_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      # This maps the local init.sql file into the container.
      # MySQL will automatically run any .sql scripts found in this directory on startup.
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped